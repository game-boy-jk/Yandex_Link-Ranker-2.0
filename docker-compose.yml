services:
  link-ranker:
    build:
      context: .
      args:
        PYTHON_VERSION: "${PYTHON_VERSION:-3.14.6}"
    image: link-ranker:local
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./web_data:/app/web_data
      - ./results:/app/results
    restart: unless-stopped
